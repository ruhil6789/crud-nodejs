name: Deploy API Backend to QA

on:
  push:
    branches:
      - qa

env:
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Automated Testing (must pass before deploy)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Run tests
        run: npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            dist/
            package.json
            package-lock.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Deploy to EC2
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/crud-nodejs

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "$PREV_COMMIT" > .deploy_prev_commit

            # Pull and deploy
            git fetch origin qa
            git reset --hard origin/qa
            docker-compose down || true
            docker-compose up -d --build

            echo "Deploy completed. Previous commit: $PREV_COMMIT"

      # ─────────────────────────────────────────────────────────────
      # Health Check — waits for container, retries for 3 minutes
      # Runs on the GitHub Actions runner (not SSH) so it tests
      # real external connectivity to your EC2 instance.
      #
      # Required secret: EC2_APP_URL  e.g. http://1.2.3.4:3002
      # If not set, falls back to http://<EC2_HOST>:3002
      # ─────────────────────────────────────────────────────────────
      - name: Health check
        id: healthcheck
        run: |
          # ── Resolve the base URL ──────────────────────────────────
          APP_URL="${{ secrets.EC2_APP_URL }}"
          # if [ -z "$APP_URL" ]; then
            APP_URL="http://${{ secrets.EC2_HOST }}"
          # fi
          # Strip any trailing slash
          APP_URL="${APP_URL%/}"
          HEALTH_URL="${APP_URL}/health"

          echo "Target: ${HEALTH_URL}"

          # ── Wait for container to initialise ─────────────────────
          echo "Waiting 30s for container to start..."
          sleep 30

          # ── Retry loop: 18 attempts × 10s = 3 min max ────────────
          MAX=18
          WAIT=10
          for i in $(seq 1 $MAX); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 15 \
              "${HEALTH_URL}" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed on attempt $i (HTTP 200)"
              exit 0
            fi

            echo "Attempt $i/${MAX} — HTTP ${HTTP_CODE}, retrying in ${WAIT}s..."
            sleep $WAIT
          done

          echo "❌ Health check failed after ${MAX} attempts."
          echo ""
          echo "Troubleshooting tips:"
          echo "  1. Confirm EC2 security group allows inbound TCP on port 3002"
          echo "  2. Confirm your app exposes GET /health returning HTTP 200"
          echo "  3. Check container logs: docker-compose logs --tail=50"
          exit 1

      # ─────────────────────────────────────────────────────────────
      # Rollback — triggers only when deploy OR health check fails.
      # Fixed bugs from original:
      #   - Correct action name: appleboy (not applyboy)
      #   - Added space in: [ -f .deploy_prev_commit ]
      #   - Closed if/else block with fi
      #   - Properly indented script body
      # ─────────────────────────────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/crud-nodejs

            if [ -f .deploy_prev_commit ]; then
              PREV=$(cat .deploy_prev_commit)
              echo "🔄 Rolling back to commit: $PREV"
              git fetch origin qa
              git reset --hard "$PREV"
              docker-compose down || true
              docker-compose up -d --build
              echo "✅ Rollback completed successfully"
            else
              echo "⚠️  No .deploy_prev_commit file found."
              echo "    Attempting to bring containers down cleanly..."
              docker-compose down || true
              echo "❌ Manual rollback required — no previous commit reference available"
              exit 1
            fi