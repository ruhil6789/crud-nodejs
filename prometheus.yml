global:
  scrape_interval: 15s
  evaluation_interval: 15s

#Alert manager configutations
alerting: 
  alertmanagers:
    - static_configs:
        -  targets: []

# loads rules and periodically evaluates them
rules_files:
    # - "first_rules.yml" 

scrape_configs:
    # Prometheus self monitoring
    - job_name: "prometheus"
      static_configs:
          - targets: [localhost:9090]   

     # Node Exporter for system metrics
    - job_name: "node_exporter"
      static_configs:
           - targets: ["localhost:9100"]              

    # Your Node.js application
    - job_name: "crud-api"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:3002"]  # Your app port       

    # Redis Exporter for ElastiCache
    - job_name: "redis"
      static_configs:
        - targets: ["localhost:9121"]   

    # MongoDB Exporter
    - job_name: "mongodb"
      static_configs:
        - targets: ["localhost:9216"] 
    
    # CloudWatch Exporter for AWS services (S3, additional Redis metrics)
    - job_name: "cloudwatch"
      static_configs:
        - targets: ["localhost:9106"]
      scrape_interval: 300s  # CloudWatch has 5-minute resolution

