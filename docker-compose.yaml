version: "3.8"

services:
  # Your existing app service
  app:
    build: .
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      # Override for Docker: app container connects to Redis by service name
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: always
    networks:
      - monitoring-network
    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Redis service
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Host 6380 to avoid conflict with existing Redis on 6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - monitoring-network
    # Optional: Add health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # Redis Exporter for metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - monitoring-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  # Prometheus for metrics collection
  prometheus:
    build:
      context: .
      dockerfile: prometheus/Dockerfile
    image: github-prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    depends_on:
      - redis-exporter
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  # Optional: Grafana for nice dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Changed from 3001 (conflicts with Next.js dev server)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Change this!
      # Removed GF_INSTALL_PLUGINS - was causing crash when network times out
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

# Networks
networks:
  monitoring-network:
    driver: bridge

# Volumes for persistent data
volumes:
  redis-data:
  prometheus-data:
  grafana-data: